name: Build collector apps

# Builds the participant app for Windows and macOS on GitHub's cloud machines,
# so you don't need to own either OS. Download the finished files from the run's
# "Artifacts" section, then drop them in your Drive folder.

on:
  workflow_dispatch:         # build only when you click "Run workflow" in the Actions tab
                             # (rebuilds are rare — only when the endpoint/token or code changes)

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: GarminCollector-windows
          - os: macos-latest
            artifact: GarminCollector-mac
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        # Pins match pyproject.toml / collector/server so the desktop app,
        # server, and analysis env all use the same Garmin auth stack.
        run: pip install garminconnect==0.3.6 garth==0.8.0 pandas numpy requests pyinstaller

      - name: Inject endpoint config from secrets
        # Replaces the PASTE_* placeholders in the source with the repo secrets,
        # so the real URL/token are baked into the binary without ever being
        # committed. Runs on the runner only; the change is never pushed back.
        shell: python
        env:
          ENDPOINT_URL: ${{ secrets.COLLECTOR_ENDPOINT_URL }}
          UPLOAD_TOKEN: ${{ secrets.COLLECTOR_UPLOAD_TOKEN }}
        run: |
          import os, pathlib
          p = pathlib.Path("collector/desktop/garmin_collector.py")
          s = p.read_text()
          s = s.replace('"PASTE_YOUR_APPS_SCRIPT_WEB_APP_URL_HERE"', repr(os.environ["ENDPOINT_URL"]))
          s = s.replace('"PASTE_THE_SHARED_SECRET_HERE"', repr(os.environ["UPLOAD_TOKEN"]))
          p.write_text(s)

      - name: Build app
        # --paths collector lets PyInstaller find & bundle the shared
        # garmin_fetch.py that garmin_collector.py imports.
        run: pyinstaller --onefile --windowed --name GarminCollector --paths collector collector/desktop/garmin_collector.py

      - name: Zip macOS app bundle
        if: runner.os == 'macOS'
        run: cd dist && zip -r GarminCollector-mac.zip GarminCollector.app

      - name: Upload Windows .exe
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/GarminCollector.exe

      - name: Upload macOS .zip
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/GarminCollector-mac.zip
