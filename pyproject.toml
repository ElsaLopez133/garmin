[project]
name = "garmin-cycle-analytics"
version = "0.1.0"
description = "Download Garmin health data and analyze menstrual cycle phase and ovulation signals."
requires-python = ">=3.10"
# Shared core — the download engine (collector/garmin_fetch.py), the collector
# front-ends, and the personal scripts all need these.
dependencies = [
    "garminconnect==0.3.6",
    "garth==0.8.0",
    "pandas",
    "numpy",
    "requests",
]

[project.optional-dependencies]
# The deployed FastAPI web collector. Render installs this with `pip install .[server]`
# (base + these), which reproduces the old collector/server/requirements.txt exactly.
server = [
    "fastapi",
    "uvicorn[standard]",
    "jinja2",
    "python-multipart",
]
# Plotting, stats, and ML for the personal scripts and the analysis notebooks.
analysis = [
    "tqdm",
    "matplotlib",
    "seaborn",
    "scipy",
    "scikit-learn",
]
# Test + notebook-hygiene tooling. Not needed at runtime or on Render.
dev = [
    "pytest",
    "nbstripout",
    "pre-commit",
]

# The project installs two small pure-Python packages so `import cyclelib` /
# `import preprocessing` resolve everywhere (tests, notebooks, a plain REPL) without
# sys.path shims. Everything else (personal/, collector/) is still resolved from the
# working directory, not packaged. On Render, `pip install .[server]` builds these two
# packages too; the server never imports them, and their deps (numpy/pandas) are core,
# so they are inert there.
[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["cyclelib", "preprocessing"]

[tool.setuptools.package-dir]
# preprocessing is already top-level; cyclelib is nested under analysis/.
cyclelib = "analysis/cyclelib"

[tool.uv]
# Install the project itself (editable) so cyclelib/preprocessing are importable.
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
